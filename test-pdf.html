<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF 生成测试</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        h1 { color: #333; }
        .test-btn {
            padding: 15px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px 0;
        }
        .test-btn:hover { background: #5568d6; }
        .result { margin: 20px 0; padding: 15px; background: #f5f5f5; border-radius: 8px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        iframe { width: 100%; height: 600px; border: 1px solid #ddd; margin: 10px 0; }
        pre { background: #333; color: #0f0; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>📄 PDF 生成功能测试</h1>
    
    <div id="status"></div>
    
    <button class="test-btn" onclick="testPDFGeneration()">测试生成 PDF</button>
    
    <div id="result"></div>
    
    <h2>测试步骤：</h2>
    <ol>
        <li>点击上方 "测试生成 PDF" 按钮</li>
        <li>如果成功，会在下方显示 PDF 预览</li>
        <li>可以点击 "下载 PDF" 保存到本地</li>
    </ol>

    <script src="js/jspdf.min.js"></script>
    <script>
        function testPDFGeneration() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div class="result">正在生成 PDF...</div>';
            
            try {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                
                // 页面设置
                const pageWidth = 210;
                const margin = 25;
                let y = margin;
                
                // 标题
                doc.setFontSize(16);
                doc.setFont('helvetica', 'bold');
                const title = '应急装置电池放电时间记录表';
                const titleWidth = doc.getTextWidth(title);
                doc.text(title, (pageWidth - titleWidth) / 2, y);
                y += 15;
                
                // 测试信息（使用英文避免中文问题）
                doc.setFontSize(10);
                doc.setFont('helvetica', 'normal');
                doc.text('安装地点: 1号楼配电室', margin, y);
                y += 7;
                doc.text('测试日期: 2026-04-20', margin, y);
                y += 7;
                doc.text('测试时间: 14:30', margin, y);
                y += 15;
                
                // 表格标题
                doc.setFillColor(240, 240, 240);
                doc.rect(margin, y - 5, pageWidth - 2 * margin, 8, 'F');
                doc.text('序号', margin + 3, y);
                doc.text('电量', margin + 25, y);
                doc.text('时间', margin + 60, y);
                y += 8;
                
                // 表格内容
                doc.setFontSize(9);
                const testData = [
                    { num: 1, voltage: '100%', time: '0分钟' },
                    { num: 2, voltage: '80%', time: '20分钟' },
                    { num: 3, voltage: '60%', time: '40分钟' },
                    { num: 4, voltage: '40%', time: '60分钟' },
                    { num: 5, voltage: '20%', time: '80分钟' },
                    { num: 6, voltage: '0%', time: '100分钟' }
                ];
                
                testData.forEach(item => {
                    doc.text(String(item.num), margin + 3, y);
                    doc.text(item.voltage, margin + 25, y);
                    doc.text(item.time, margin + 60, y);
                    y += 7;
                });
                
                // 签字栏
                y += 10;
                doc.setFontSize(9);
                const colW = (pageWidth - 2 * margin) / 3;
                doc.text('操作者: ________', margin, y);
                y += 6;
                doc.text('日期: ________', margin, y);
                
                doc.text('领班: ________', margin + colW, y - 6);
                doc.text('日期: ________', margin + colW, y);
                
                doc.text('工程主任: ________', margin + colW * 2, y - 6);
                doc.text('日期: ________', margin + colW * 2, y);
                
                // 表单编号
                y += 15;
                doc.setFontSize(7);
                doc.text('SHKS/R0/2579/REV03/20240630', margin, y);
                
                // 生成 PDF
                const pdfBlob = doc.output('blob');
                const pdfUrl = URL.createObjectURL(pdfBlob);
                
                // 显示结果
                resultDiv.innerHTML = `
                    <div class="result success">
                        <h3>✅ PDF 生成成功！</h3>
                        <p>文件大小: ${(pdfBlob.size / 1024).toFixed(1)} KB</p>
                        <button class="test-btn" onclick="downloadPDF()">下载 PDF</button>
                    </div>
                    <h3>PDF 预览:</h3>
                    <iframe src="${pdfUrl}"></iframe>
                `;
                
                // 保存给全局下载用
                window.currentPDF = pdfBlob;
                
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="result error">
                        <h3>❌ PDF 生成失败</h3>
                        <pre>${error.message}</pre>
                    </div>
                `;
                console.error('PDF Error:', error);
            }
        }
        
        function downloadPDF() {
            if (window.currentPDF) {
                const link = document.createElement('a');
                link.href = URL.createObjectURL(window.currentPDF);
                link.download = '测试报告_' + new Date().toISOString().slice(0,10) + '.pdf';
                link.click();
            }
        }
    </script>
</body>
</html>
