<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>jsPDF Test</title>
    <script src="../../common/js/jspdf.min.js"></script>
</head>
<body>
    <h1>jsPDF Test</h1>
    <div id="status">Loading...</div>
    <script>
        document.getElementById('status').textContent = typeof jsPDF !== 'undefined' ? 'jsPDF loaded: ' + typeof jsPDF : 'jsPDF NOT loaded';
        if (typeof jsPDF !== 'undefined') {
            var doc = new jsPDF();
            doc.text('Hello World', 10, 10);
            doc.save('test.pdf');
            document.getElementById('status').textContent = 'PDF generated!';
        }
    </script>
</body>
</html>
