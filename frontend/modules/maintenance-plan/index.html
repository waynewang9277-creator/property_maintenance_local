<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>维保计划</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f5f5f5; }
        h1 { text-align: center; color: #333; }
        .cal { background: #fff; border-radius: 8px; padding: 15px; max-width: 400px; margin: 0 auto; }
        .cal-title { text-align: center; font-size: 20px; margin-bottom: 15px; }
        .week { display: flex; background: #eee; border-radius: 4px; margin-bottom: 5px; }
        .wd { flex: 1; text-align: center; padding: 8px; font-weight: bold; font-size: 12px; }
        .days { display: flex; flex-wrap: wrap; }
        .day { width: 14.28%; height: 40px; text-align: center; line-height: 40px; cursor: pointer; }
        .day:hover { background: #e0e0e0; }
        .day.today { background: #667eea; color: #fff; border-radius: 50%; }
        .day.selected { background: #52c41a; color: #fff; border-radius: 50%; }
    </style>
</head>
<body>
    <h1>📅 维保计划</h1>
    <div class="cal">
        <div class="cal-title" id="title">2026年5月</div>
        <div class="week">
            <div class="wd">日</div><div class="wd">一</div><div class="wd">二</div>
            <div class="wd">三</div><div class="wd">四</div><div class="wd">五</div><div class="wd">六</div>
        </div>
        <div class="days" id="days"></div>
    </div>

    <script>
        var year = 2026;
        var month = 4; // May (0-based)
        
        function getDays(y, m) { return new Date(y, m + 1, 0).getDate(); }
        function getFirst(y, m) { return new Date(y, m, 1).getDay(); }
        
        function render() {
            document.getElementById('title').textContent = year + '年' + (month + 1) + '月';
            var daysEl = document.getElementById('days');
            var first = getFirst(year, month);
            var total = getDays(year, month);
            var html = '';
            
            // 空格子
            for (var i = 0; i < first; i++) {
                html += '<div class="day"></div>';
            }
            
            // 日期 1-31
            for (var d = 1; d <= total; d++) {
                html += '<div class="day" onclick="alert(' + d + ')">' + d + '</div>';
            }
            
            daysEl.innerHTML = html;
        }
        
        render();
    </script>
</body>
</html>
