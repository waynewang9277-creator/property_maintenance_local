<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>维保计划</title>
    <link rel="stylesheet" href="../../common/css/style.css">
    <style>
        .plan-container { padding: 15px; }
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px;
            background: #fff;
            border-radius: 8px;
        }
        .calendar-title { font-size: 18px; font-weight: bold; color: #333; }
        .calendar-nav { display: flex; gap: 10px; }
        .calendar-nav button {
            background: #f0f0f0;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            margin-bottom: 15px;
            min-height: 200px;
        }
        .calendar-weekday {
            text-align: center;
            padding: 10px 5px;
            font-weight: bold;
            color: #666;
            font-size: 12px;
            background: #f5f5f5;
        }
        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            position: relative;
            min-width: 30px;
            min-height: 30px;
        }
        .calendar-day.today { background: #1890ff; color: #fff; }
        .calendar-day.has-plan::after {
            content: '';
            position: absolute;
            bottom: 3px;
            width: 5px;
            height: 5px;
            background: #ff4d4f;
            border-radius: 50%;
        }
        .calendar-day.selected { background: #52c41a; color: #fff; }
        .plan-list { background: #fff; border-radius: 8px; padding: 15px; margin-top: 15px; }
        .plan-list-title { font-size: 16px; font-weight: bold; color: #333; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
        .plan-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            background: #f9f9f9;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .plan-item.checked { background: #f6ffed; border: 1px solid #b7eb8f; }
        .plan-item-left { display: flex; align-items: center; gap: 10px; }
        .plan-icon { font-size: 20px; }
        .plan-name { font-size: 14px; color: #333; }
        .btn-delete-plan {
            background: #ff4d4f;
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            font-size: 14px;
            cursor: pointer;
        }
        .btn-add-plan {
            background: #52c41a;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }
        .btn-add-plan:active { background: #73d13d; }
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-overlay.show { display: flex; }
        .modal-content {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; text-align: center; }
        .modal-date { text-align: center; color: #666; margin-bottom: 15px; font-size: 14px; }
        .module-option {
            display: flex;
            align-items: center;
            padding: 12px;
            background: #f9f9f9;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
        }
        .module-option:active { background: #e6f7ff; }
        .module-option.selected { background: #e6f7ff; border: 1px solid #1890ff; }
        .module-option-icon { font-size: 20px; margin-right: 10px; }
        .module-option-name { font-size: 14px; color: #333; }
        .modal-actions { display: flex; gap: 10px; margin-top: 15px; }
        .btn-modal { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
        .btn-modal-cancel { background: #f0f0f0; color: #333; }
        .btn-modal-confirm { background: #1890ff; color: #fff; }
        .no-plan { text-align: center; padding: 30px; color: #999; }
    </style>
</head>
<body>
    <div class="container">
        <header class="module-header">
            <button class="btn-back" onclick="if(parent.app && parent.app.backToCategory){parent.app.backToCategory();}else{window.location.href='../../index.html';}">← 返回分类</button>
            <h2 class="module-title">📅 维保计划</h2>
        </header>
        <main class="module-main">
            <div class="plan-container">
                <!-- 日历头部 -->
                <div class="calendar-header">
                    <button class="calendar-nav-btn" onclick="plan.changeMonth(-1)">◀ 上月</button>
                    <span class="calendar-title" id="calendar-title">2026年5月</span>
                    <button class="calendar-nav-btn" onclick="plan.changeMonth(1)">下月 ▶</button>
                </div>
                
                <!-- 日历网格 -->
                <div class="calendar-grid" id="calendar-grid"></div>
                
                <!-- 当日计划列表 -->
                <div class="plan-list">
                    <div class="plan-list-title" id="plan-list-title">5月16日 计划</div>
                    <div id="plan-items"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- 新增计划弹窗 -->
    <div class="modal-overlay" id="modal-add-plan">
        <div class="modal-content">
            <div class="modal-title">添加维保项目</div>
            <div class="modal-date" id="modal-date"></div>
            <div id="module-options"></div>
            <div class="modal-actions">
                <button class="btn-modal btn-modal-cancel" onclick="plan.closeModal()">取消</button>
                <button class="btn-modal btn-modal-confirm" onclick="plan.addPlan()">确定添加</button>
            </div>
        </div>
    </div>

    <script src="../../common/js/data-manager.js"></script>
    <script src="module.js"></script>
</body>
</html>
