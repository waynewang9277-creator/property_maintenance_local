<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>维保计划</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', Arial; background: #f5f5f5; color: #333; }
        .container { padding: 15px; max-width: 500px; margin: 0 auto; }
        h1 { text-align: center; font-size: 20px; margin-bottom: 15px; }
        
        /* 返回按钮 */
        .back { background: #667eea; color: #fff; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; margin-bottom: 15px; font-size: 14px; }
        
        /* 日历 */
        .cal { background: #fff; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .cal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .cal-title { font-size: 18px; font-weight: bold; }
        .cal-nav { display: flex; gap: 8px; }
        .cal-nav button { background: #667eea; color: #fff; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-size: 12px; }
        .week { display: flex; background: #f0f0f0; border-radius: 4px; margin-bottom: 5px; }
        .wd { flex: 1; text-align: center; padding: 8px; font-weight: bold; font-size: 12px; color: #666; }
        .days { display: flex; flex-wrap: wrap; }
        .day { width: 14.28%; height: 45px; display: flex; align-items: center; justify-content: center; font-size: 14px; cursor: pointer; }
        .day:hover { background: #f0f0f0; }
        .day.today { background: #667eea; color: #fff; border-radius: 50%; }
        .day.selected { background: #52c41a; color: #fff; border-radius: 50%; }
        .day.has-plan::after { content: ''; position: absolute; bottom: 3px; width: 6px; height: 6px; background: #ff4d4f; border-radius: 50%; }
        .day.has-plan { position: relative; }
        .day.empty { cursor: default; }
        
        /* 计划列表 */
        .plans { background: #fff; border-radius: 8px; padding: 15px; }
        .plans-title { font-size: 16px; font-weight: bold; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #eee; }
        .plan-item { display: flex; align-items: center; justify-content: space-between; padding: 10px; background: #f9f9f9; border-radius: 8px; margin-bottom: 8px; }
        .plan-item.checked { background: #f6ffed; border: 1px solid #b7eb8f; }
        .plan-info { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 14px; }
        .plan-del { background: #ff4d4f; color: #fff; border: none; border-radius: 50%; width: 22px; height: 22px; font-size: 14px; cursor: pointer; }
        .no-plan { text-align: center; padding: 25px; color: #999; }
        .btn-add { background: #52c41a; color: #fff; border: none; border-radius: 8px; padding: 14px; font-size: 15px; cursor: pointer; width: 100%; margin-top: 10px; }
        
        /* 弹窗 */
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal.show { display: flex; }
        .modal-body { background: #fff; border-radius: 12px; padding: 20px; width: 90%; max-height: 70vh; overflow-y: auto; }
        .modal-title { font-size: 18px; font-weight: bold; text-align: center; margin-bottom: 8px; }
        .modal-date { text-align: center; color: #666; margin-bottom: 15px; font-size: 14px; }
        .opt { display: flex; align-items: center; padding: 12px; background: #f9f9f9; border-radius: 8px; margin-bottom: 8px; cursor: pointer; }
        .opt.selected { background: #e6f7ff; border: 1px solid #667eea; }
        .opt-name { font-size: 14px; }
        .opt-check { margin-left: auto; color: #667eea; }
        .modal-btns { display: flex; gap: 10px; margin-top: 15px; }
        .btn-cancel { flex: 1; padding: 12px; background: #f0f0f0; color: #333; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
        .btn-confirm { flex: 1; padding: 12px; background: #667eea; color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <button class="back" id="btnBack">← 返回</button>
        <h1>📅 维保计划</h1>
        
        <div class="cal">
            <div class="cal-head">
                <button class="cal-nav" id="btnPrev">◀ 上月</button>
                <span class="cal-title" id="calTitle">2026年5月</span>
                <button class="cal-nav" id="btnNext">下月 ▶</button>
            </div>
            <div class="week">
                <div class="wd">日</div><div class="wd">一</div><div class="wd">二</div>
                <div class="wd">三</div><div class="wd">四</div><div class="wd">五</div><div class="wd">六</div>
            </div>
            <div class="days" id="days"></div>
        </div>
        
        <div class="plans">
            <div class="plans-title" id="plansTitle">5月16日 计划</div>
            <div id="plansList"></div>
        </div>
    </div>

    <!-- 弹窗 -->
    <div class="modal" id="modal">
        <div class="modal-body">
            <div class="modal-title">添加维保项目</div>
            <div class="modal-date" id="modalDate"></div>
            <div id="modalOpts"></div>
            <div class="modal-btns">
                <button class="btn-cancel" id="btnCancel">取消</button>
                <button class="btn-confirm" id="btnConfirm">确定添加</button>
            </div>
        </div>
    </div>

    <script>
        // 维保项目配置
        const MODS = [
            { id: 'battery-test', name: '应急电池放电测试', icon: '🔋' },
            { id: 'generator', name: '发电机组维护性运转记录', icon: '⚙️' },
            { id: 'ats', name: 'ATS维护保养记录', icon: '🔌' },
            { id: 'capacitor-check', name: '电容检查及测温', icon: '🔌' },
            { id: 'busbar-check', name: '供电母排检查及测温', icon: '⚡' },
            { id: 'power-room-monthly', name: '强电间月度巡检', icon: '📋' },
            { id: 'elevator-escape', name: '电梯逃生门检查', icon: '🚪' },
            { id: 'elevator-handrail-fault', name: '电梯扶手梯故障报告', icon: '🛗' }
        ];
        const KEY = 'maintenance_plan_v2';

        // 状态
        var year = new Date().getFullYear();
        var month = new Date().getMonth();
        var selDate = formatDate(new Date());
        var selOpts = [];

        // DOM
        document.getElementById('btnBack').onclick = goBack;
        document.getElementById('btnPrev').onclick = function() { changeMonth(-1); };
        document.getElementById('btnNext').onclick = function() { changeMonth(1); };
        document.getElementById('btnCancel').onclick = closeModal;
        document.getElementById('btnConfirm').onclick = confirmAdd;

        // 工具函数
        function formatDate(d) {
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        }
        function getDays(y, m) { return new Date(y, m + 1, 0).getDate(); }
        function getFirst(y, m) { return new Date(y, m, 1).getDay(); }

        // 数据
        function getData() {
            var d = localStorage.getItem(KEY);
            return d ? JSON.parse(d) : {};
        }
        function setData(d) {
            localStorage.setItem(KEY, JSON.stringify(d));
        }
        function getPlans(ds) {
            return getData()[ds] || [];
        }
        function savePlans(ds, ps) {
            var d = getData();
            if (ps.length === 0) delete d[ds]; else d[ds] = ps;
            setData(d);
        }

        // 切换月份
        function changeMonth(n) {
            month += n;
            if (month > 11) { month = 0; year++; }
            if (month < 0) { month = 11; year--; }
            renderCal();
        }

        // 渲染日历
        function renderCal() {
            document.getElementById('calTitle').textContent = year + '年' + (month + 1) + '月';
            var grid = document.getElementById('days');
            var data = getData();
            var today = formatDate(new Date());
            var first = getFirst(year, month);
            var total = getDays(year, month);
            var html = '';

            // 空格子
            for (var i = 0; i < first; i++) {
                html += '<div class="day empty"></div>';
            }

            // 日期
            for (var d = 1; d <= total; d++) {
                var ds = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
                var cls = 'day';
                if (ds === today) cls += ' today';
                if (ds === selDate) cls += ' selected';
                if (data[ds] && data[ds].length > 0) cls += ' has-plan';
                html += '<div class="' + cls + '" onclick="selectDate(\'' + ds + '\')">' + d + '</div>';
            }

            grid.innerHTML = html;
        }

        // 选择日期
        function selectDate(ds) {
            selDate = ds;
            renderCal();
            renderPlans();
        }

        // 渲染计划
        function renderPlans() {
            var d = new Date(selDate);
            document.getElementById('plansTitle').textContent = (d.getMonth() + 1) + '月' + d.getDate() + '日 周' + ['日','一','二','三','四','五','六'][d.getDay()] + ' 计划';
            var list = document.getElementById('plansList');
            var plans = getPlans(selDate);

            if (plans.length === 0) {
                list.innerHTML = '<div class="no-plan">暂无计划</div><button class="btn-add" onclick="openModal()">➕ 添加维保项目</button>';
                return;
            }

            var html = '';
            for (var i = 0; i < plans.length; i++) {
                var p = plans[i];
                var m = null;
                for (var j = 0; j < MODS.length; j++) {
                    if (MODS[j].id === p.moduleId) { m = MODS[j]; break; }
                }
                if (!m) m = { icon: '📋', name: p.moduleId };
                html += '<div class="plan-item' + (p.checked ? ' checked' : '') + '">' +
                    '<div class="plan-info" onclick="togglePlan(' + i + ')">' +
                    '<span>' + (p.checked ? '✅' : '⬜') + '</span>' +
                    '<span>' + m.icon + ' ' + m.name + '</span></div>' +
                    '<button class="plan-del" onclick="deletePlan(' + i + ')">×</button></div>';
            }
            list.innerHTML = html + '<button class="btn-add" onclick="openModal()">➕ 添加更多项目</button>';
        }

        // 弹窗
        function openModal() {
            document.getElementById('modalDate').textContent = selDate;
            var opts = document.getElementById('modalOpts');
            var cur = getPlans(selDate);
            var existing = [];
            for (var i = 0; i < cur.length; i++) existing.push(cur[i].moduleId);
            selOpts = existing.slice();

            var html = '';
            for (var i = 0; i < MODS.length; i++) {
                var m = MODS[i];
                var sel = existing.indexOf(m.id) > -1;
                html += '<div class="opt' + (sel ? ' selected' : '') + '" onclick="toggleOpt(\'' + m.id + '\', this)">' +
                    '<span>' + m.icon + '</span>' +
                    '<span class="opt-name">' + m.name + '</span>' +
                    '<span class="opt-check">' + (sel ? '✓' : '') + '</span></div>';
            }
            opts.innerHTML = html;
            document.getElementById('modal').classList.add('show');
        }

        function toggleOpt(id, el) {
            var idx = selOpts.indexOf(id);
            if (idx > -1) {
                selOpts.splice(idx, 1);
                el.classList.remove('selected');
                el.querySelector('.opt-check').textContent = '';
            } else {
                selOpts.push(id);
                el.classList.add('selected');
                el.querySelector('.opt-check').textContent = '✓';
            }
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('show');
            selOpts = [];
        }

        function confirmAdd() {
            if (selOpts.length === 0) { alert('请选择维保项目'); return; }
            var cur = getPlans(selDate);
            var ids = [];
            for (var i = 0; i < cur.length; i++) ids.push(cur[i].moduleId);
            for (var i = 0; i < selOpts.length; i++) {
                if (ids.indexOf(selOpts[i]) === -1) {
                    cur.push({ moduleId: selOpts[i], checked: false });
                }
            }
            savePlans(selDate, cur);
            closeModal();
            renderCal();
            renderPlans();
        }

        function deletePlan(idx) {
            var ps = getPlans(selDate);
            ps.splice(idx, 1);
            savePlans(selDate, ps);
            renderCal();
            renderPlans();
        }

        function togglePlan(idx) {
            var ps = getPlans(selDate);
            ps[idx].checked = !ps[idx].checked;
            savePlans(selDate, ps);
            renderPlans();
        }

        function goBack() {
            if (parent.app && parent.app.backToCategory) parent.app.backToCategory();
            else window.location.href = '../../index.html';
        }

        // 初始化
        renderCal();
        renderPlans();
    </script>
</body>
</html>
