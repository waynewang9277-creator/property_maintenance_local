<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>维保计划</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; background: #f5f5f5; color: #333; }
        .container { padding: 15px; }
        .title { font-size: 20px; font-weight: bold; text-align: center; margin-bottom: 15px; }
        .back-btn {
            background: #667eea; color: #fff; border: none; padding: 10px 15px;
            border-radius: 5px; cursor: pointer; font-size: 14px; margin-bottom: 15px;
        }
        
        /* 日历头部 */
        .cal-header {
            display: flex; justify-content: space-between; align-items: center;
            background: #fff; padding: 15px; border-radius: 8px; margin-bottom: 10px;
        }
        .cal-title { font-size: 18px; font-weight: bold; }
        .cal-nav { display: flex; gap: 8px; }
        .cal-nav button {
            background: #667eea; color: #fff; border: none;
            padding: 8px 12px; border-radius: 5px; cursor: pointer; font-size: 12px;
        }
        
        /* 日历主体 - 表格形式 */
        .cal-wrap { background: #fff; border-radius: 8px; padding: 10px; margin-bottom: 15px; }
        .cal-week { display: flex; background: #f0f0f0; border-radius: 4px; margin-bottom: 5px; }
        .cal-weekday { flex: 1; text-align: center; padding: 8px 0; font-weight: bold; font-size: 12px; color: #666; }
        .cal-grid { display: flex; flex-wrap: wrap; }
        .cal-cell {
            width: 14.28%; height: 45px; display: flex; align-items: center; justify-content: center;
            font-size: 14px; cursor: pointer;
        }
        .cal-cell.empty { cursor: default; }
        .cal-cell .day-num {
            width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
            border-radius: 50%; transition: all 0.2s;
        }
        .cal-cell:active .day-num { background: #e0e0e0; }
        .cal-cell.today .day-num { background: #667eea; color: #fff; }
        .cal-cell.selected .day-num { background: #52c41a; color: #fff; }
        .cal-cell.has-plan .day-num { position: relative; }
        .cal-cell.has-plan .day-num::after {
            content: ''; position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%);
            width: 6px; height: 6px; background: #ff4d4f; border-radius: 50%;
        }
        
        /* 计划列表 */
        .plan-box { background: #fff; border-radius: 8px; padding: 15px; }
        .plan-title { font-size: 16px; font-weight: bold; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #eee; }
        .plan-item { display: flex; align-items: center; justify-content: space-between; padding: 10px; background: #f9f9f9; border-radius: 8px; margin-bottom: 8px; }
        .plan-item.checked { background: #f6ffed; border: 1px solid #b7eb8f; }
        .plan-info { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .plan-name { font-size: 14px; }
        .btn-del { background: #ff4d4f; color: #fff; border: none; border-radius: 50%; width: 22px; height: 22px; font-size: 14px; cursor: pointer; }
        .no-plan { text-align: center; padding: 25px; color: #999; }
        .btn-add { background: #52c41a; color: #fff; border: none; border-radius: 8px; padding: 14px; font-size: 15px; cursor: pointer; width: 100%; margin-top: 10px; }
        
        /* 弹窗 */
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal.show { display: flex; }
        .modal-body { background: #fff; border-radius: 12px; padding: 20px; width: 90%; max-height: 70vh; overflow-y: auto; }
        .modal-title { font-size: 18px; font-weight: bold; text-align: center; margin-bottom: 8px; }
        .modal-date { text-align: center; color: #666; margin-bottom: 15px; font-size: 14px; }
        .opt-item { display: flex; align-items: center; padding: 12px; background: #f9f9f9; border-radius: 8px; margin-bottom: 8px; cursor: pointer; }
        .opt-item.selected { background: #e6f7ff; border: 1px solid #667eea; }
        .opt-name { font-size: 14px; }
        .opt-check { margin-left: auto; color: #667eea; }
        .modal-btns { display: flex; gap: 10px; margin-top: 15px; }
        .btn-cancel { flex: 1; padding: 12px; background: #f0f0f0; color: #333; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
        .btn-confirm { flex: 1; padding: 12px; background: #667eea; color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <button class="back-btn" id="btnBack">← 返回</button>
        <div class="title">📅 维保计划</div>
        
        <div class="cal-header">
            <button class="cal-nav-btn" id="btnPrev">◀ 上月</button>
            <span class="cal-title" id="calTitle">2026年5月</span>
            <button class="cal-nav-btn" id="btnNext">下月 ▶</button>
        </div>
        
        <div class="cal-wrap">
            <div class="cal-week">
                <div class="cal-weekday">日</div>
                <div class="cal-weekday">一</div>
                <div class="cal-weekday">二</div>
                <div class="cal-weekday">三</div>
                <div class="cal-weekday">四</div>
                <div class="cal-weekday">五</div>
                <div class="cal-weekday">六</div>
            </div>
            <div class="cal-grid" id="calGrid"></div>
        </div>
        
        <div class="plan-box">
            <div class="plan-title" id="planTitle">5月16日 计划</div>
            <div id="planList"></div>
        </div>
    </div>

    <!-- 弹窗 -->
    <div class="modal" id="modalAdd">
        <div class="modal-body">
            <div class="modal-title">添加维保项目</div>
            <div class="modal-date" id="modalDate"></div>
            <div id="modalOpts"></div>
            <div class="modal-btns">
                <button class="btn-cancel" id="btnCancel">取消</button>
                <button class="btn-confirm" id="btnConfirm">确定添加</button>
            </div>
        </div>
    </div>

    <script src="../../common/js/data-manager.js"></script>
    <script>
        // 配置
        const MODS = [
            { id: 'battery-test', name: '应急电池放电测试', icon: '🔋' },
            { id: 'generator', name: '发电机组维护性运转记录', icon: '⚙️' },
            { id: 'ats', name: 'ATS维护保养记录', icon: '🔌' },
            { id: 'capacitor-check', name: '电容检查及测温', icon: '🔌' },
            { id: 'busbar-check', name: '供电母排检查及测温', icon: '⚡' },
            { id: 'power-room-monthly', name: '强电间月度巡检', icon: '📋' },
            { id: 'elevator-escape', name: '电梯逃生门检查', icon: '🚪' },
            { id: 'elevator-handrail-fault', name: '电梯扶手梯故障报告', icon: '🛗' }
        ];
        const KEY = 'maintenance_plan';

        // 状态
        let year = new Date().getFullYear();
        let month = new Date().getMonth();
        let selDate = formatDate(new Date());
        let selOpts = [];

        // 初始化
        document.getElementById('btnBack').onclick = goBack;
        document.getElementById('btnPrev').onclick = () => changeMonth(-1);
        document.getElementById('btnNext').onclick = () => changeMonth(1);
        document.getElementById('btnCancel').onclick = closeModal;
        document.getElementById('btnConfirm').onclick = confirmAdd;

        renderCal();
        renderPlan();

        // 工具函数
        function formatDate(d) {
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        }

        function getDays(y, m) { return new Date(y, m + 1, 0).getDate(); }
        function getFirst(y, m) { return new Date(y, m, 1).getDay(); }

        function getData() { return DataManager.get(KEY) || {}; }
        function setData(d) { DataManager.set(KEY, d); }

        function getPlans(ds) { return getData()[ds] || []; }
        function savePlans(ds, ps) {
            const d = getData();
            if (ps.length === 0) delete d[ds]; else d[ds] = ps;
            setData(d);
        }

        // 切换月份
        function changeMonth(n) {
            month += n;
            if (month > 11) { month = 0; year++; }
            if (month < 0) { month = 11; year--; }
            renderCal();
        }

        // 渲染日历
        function renderCal() {
            const titleEl = document.getElementById('calTitle');
            const gridEl = document.getElementById('calGrid');
            if (!titleEl || !gridEl) { alert('日历元素未找到!'); return; }
            
            titleEl.textContent = year + '年' + (month + 1) + '月';
            const data = getData();
            const today = formatDate(new Date());
            const first = getFirst(year, month);
            const days = getDays(year, month);
            
            alert('调试: 年=' + year + ' 月=' + (month+1) + ' 1号星期=' + first + ' 天数=' + days);
            
            let html = '';

            // 空格子
            for (let i = 0; i < getFirst(year, month); i++) {
                html += '<div class="cal-cell empty"></div>';
            }

            // 日期
            for (let d = 1; d <= getDays(year, month); d++) {
                const ds = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
                let cls = 'cal-cell';
                if (ds === today) cls += ' today';
                if (ds === selDate) cls += ' selected';
                if (data[ds] && data[ds].length > 0) cls += ' has-plan';
                html += '<div class="' + cls + '" onclick="selectDate(\'' + ds + '\')"><div class="day-num">' + d + '</div></div>';
            }

            grid.innerHTML = html;
        }

        // 选择日期
        function selectDate(ds) {
            selDate = ds;
            renderCal();
            renderPlan();
        }

        // 渲染计划
        function renderPlan() {
            const d = new Date(selDate);
            const title = document.getElementById('planTitle');
            title.textContent = (d.getMonth() + 1) + '月' + d.getDate() + '日 周' + ['日','一','二','三','四','五','六'][d.getDay()] + ' 计划';

            const list = document.getElementById('planList');
            const plans = getPlans(selDate);

            if (plans.length === 0) {
                list.innerHTML = '<div class="no-plan">暂无计划</div><button class="btn-add" onclick="openModal()">➕ 添加维保项目</button>';
                return;
            }

            let html = '';
            plans.forEach((p, i) => {
                const m = MODS.find(x => x.id === p.moduleId) || { icon: '📋', name: p.moduleId };
                html += '<div class="plan-item' + (p.checked ? ' checked' : '') + '">' +
                    '<div class="plan-info" onclick="togglePlan(' + i + ')">' +
                    '<span>' + (p.checked ? '✅' : '⬜') + '</span>' +
                    '<span class="plan-name">' + m.icon + ' ' + m.name + '</span></div>' +
                    '<button class="btn-del" onclick="delPlan(' + i + ')">×</button></div>';
            });
            list.innerHTML = html + '<button class="btn-add" onclick="openModal()">➕ 添加更多项目</button>';
        }

        // 弹窗
        function openModal() {
            document.getElementById('modalDate').textContent = selDate;
            const opts = document.getElementById('modalOpts');
            const cur = getPlans(selDate).map(p => p.moduleId);
            selOpts = [...cur];
            let html = '';
            MODS.forEach(m => {
                const sel = cur.includes(m.id);
                html += '<div class="opt-item' + (sel ? ' selected' : '') + '" onclick="toggleOpt(\'' + m.id + '\', this)">' +
                    '<span>' + m.icon + '</span>' +
                    '<span class="opt-name">' + m.name + '</span>' +
                    '<span class="opt-check">' + (sel ? '✓' : '') + '</span></div>';
            });
            opts.innerHTML = html;
            document.getElementById('modalAdd').classList.add('show');
        }

        function toggleOpt(id, el) {
            const i = selOpts.indexOf(id);
            if (i > -1) { selOpts.splice(i, 1); el.classList.remove('selected'); el.querySelector('.opt-check').textContent = ''; }
            else { selOpts.push(id); el.classList.add('selected'); el.querySelector('.opt-check').textContent = '✓'; }
        }

        function closeModal() {
            document.getElementById('modalAdd').classList.remove('show');
            selOpts = [];
        }

        function confirmAdd() {
            if (selOpts.length === 0) { alert('请选择维保项目'); return; }
            const cur = getPlans(selDate);
            const ids = cur.map(p => p.moduleId);
            selOpts.forEach(id => { if (!ids.includes(id)) cur.push({ moduleId: id, checked: false }); });
            savePlans(selDate, cur);
            closeModal();
            renderCal();
            renderPlan();
        }

        function delPlan(i) {
            const ps = getPlans(selDate);
            ps.splice(i, 1);
            savePlans(selDate, ps);
            renderCal();
            renderPlan();
        }

        function togglePlan(i) {
            const ps = getPlans(selDate);
            ps[i].checked = !ps[i].checked;
            savePlans(selDate, ps);
            renderPlan();
        }

        function goBack() {
            if (parent.app && parent.app.backToCategory) parent.app.backToCategory();
            else window.location.href = '../../index.html';
        }
    </script>
</body>
</html>
