<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenClaw 直接对话</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: #16213e;
            padding: 12px 20px;
            border-bottom: 1px solid #0f3460;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        header h1 { font-size: 16px; font-weight: 600; }
        header .status {
            width: 8px; height: 8px; border-radius: 50%;
            background: #4ecca3;
        }
        header .status.error { background: #ff6b6b; }
        header .status.loading { background: #f39c12; }
        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 70%;
            padding: 10px 14px;
            border-radius: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .message.user {
            align-self: flex-end;
            background: #0f3460;
            border-bottom-right-radius: 4px;
        }
        .message.assistant {
            align-self: flex-start;
            background: #16213e;
            border-bottom-left-radius: 4px;
        }
        .message.error {
            background: #4a1a1a;
            color: #ff6b6b;
        }
        .message.system {
            background: #2a2a4a;
            color: #888;
            font-style: italic;
            align-self: center;
            max-width: 90%;
        }
        #input-area {
            background: #16213e;
            padding: 12px 20px;
            border-top: 1px solid #0f3460;
            display: flex;
            gap: 10px;
        }
        #input-area input {
            flex: 1;
            background: #1a1a2e;
            border: 1px solid #0f3460;
            border-radius: 8px;
            padding: 10px 14px;
            color: #eee;
            font-size: 14px;
            outline: none;
        }
        #input-area input:focus { border-color: #4ecca3; }
        #input-area button {
            background: #4ecca3;
            color: #1a1a2e;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-weight: 600;
            cursor: pointer;
        }
        #input-area button:hover { background: #3db892; }
        #input-area button:disabled { background: #555; cursor: not-allowed; }
        .time {
            font-size: 11px;
            color: #666;
            margin-top: 4px;
        }
        .loading-dots {
            display: inline-block;
        }
        .loading-dots::after {
            content: '...';
            animation: dots 1.5s infinite;
        }
        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }
    </style>
</head>
<body>
    <header>
        <div class="status" id="statusDot"></div>
        <h1>OpenClaw 直接对话</h1>
        <span id="statusText" style="font-size:12px;color:#888;margin-left:auto;"></span>
    </header>
    <div id="chat"></div>
    <div id="input-area">
        <input type="text" id="msgInput" placeholder="输入消息..." onkeydown="if(event.key==='Enter' && !event.shiftKey) sendMsg()">
        <button id="sendBtn" onclick="sendMsg()">发送</button>
    </div>

    <script>
        const API_URL = '/api/chat';
        let sessionId = localStorage.getItem('oc_session') || 'default';
        localStorage.setItem('oc_session', sessionId);

        const chat = document.getElementById('chat');
        const input = document.getElementById('msgInput');
        const sendBtn = document.getElementById('sendBtn');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        // 检测连接状态
        async function checkStatus() {
            try {
                const res = await fetch('/api/health');
                const data = await res.json();
                if (data.status === 'ok') {
                    statusDot.className = 'status';
                    statusText.textContent = 'v' + (data.version || '').replace('🦞 OpenClaw ', '');
                } else {
                    statusDot.className = 'status error';
                    statusText.textContent = '离线';
                }
            } catch {
                statusDot.className = 'status error';
                statusText.textContent = '离线';
            }
        }
        checkStatus();
        setInterval(checkStatus, 15000);

        function addMessage(role, text, time) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            const content = document.createElement('div');
            content.textContent = text;
            div.appendChild(content);
            if (time) {
                const t = document.createElement('div');
                t.className = 'time';
                t.textContent = time;
                div.appendChild(t);
            }
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function showLoading() {
            const div = document.createElement('div');
            div.className = 'message assistant';
            div.id = 'loading';
            div.innerHTML = '<span class="loading-dots">思考中</span>';
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function removeLoading() {
            const t = document.getElementById('loading');
            if (t) t.remove();
        }

        async function sendMsg() {
            const text = input.value.trim();
            if (!text) return;

            input.value = '';
            sendBtn.disabled = true;
            addMessage('user', text);
            showLoading();

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, session_id: sessionId })
                });

                removeLoading();

                if (!res.ok) {
                    const err = await res.json();
                    addMessage('error', `请求失败: ${err.error || res.status}`);
                    return;
                }

                const data = await res.json();
                if (data.response) {
                    addMessage('assistant', data.response);
                } else {
                    addMessage('error', '（无响应）');
                }
            } catch (e) {
                removeLoading();
                addMessage('error', `网络错误: ${e.message}`);
            } finally {
                sendBtn.disabled = false;
                input.focus();
            }
        }

        // 初始消息
        addMessage('system', '已连接 OpenClaw Agent，直接对话模式');
        input.focus();
    </script>
</body>
</html>
