<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>强电维保计划</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body { font-family: 'Microsoft YaHei', Arial; background: #f5f5f5; color: #333; }
        .container { padding: 12px; max-width: 100%; }
        h1 { text-align: center; font-size: 20px; margin-bottom: 10px; }

        .back { background: #667eea; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; margin-bottom: 10px; font-size: 14px; }

        .view-tabs { display: flex; gap: 8px; margin-bottom: 10px; }
        .tab { flex: 1; padding: 10px; text-align: center; background: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
        .tab.active { background: #667eea; color: #fff; }

        .cal { background: #fff; border-radius: 10px; padding: 12px; margin-bottom: 10px; }
        .cal-head { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 10px; }
        .cal-title { font-size: 16px; font-weight: bold; min-width: 80px; text-align: center; }
        .cal-nav { display: flex; gap: 6px; flex-wrap: wrap; }
        .cal-nav button, .cal-nav .btn-export { background: #667eea; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
        .btn-export { background: #52c41a; margin-left: 50px; }
        .cal-nav .btn-export:hover { background: #3a9d0c; }
        .week { display: flex; background: #f0f0f0; border-radius: 6px; margin-bottom: 6px; }
        .wd { flex: 1; text-align: center; padding: 6px; font-weight: bold; font-size: 12px; color: #666; }
        .days { display: flex; flex-wrap: wrap; }
        .day { width: 14.28%; min-height: 52px; display: flex; flex-direction: column; align-items: center; padding: 4px 2px; cursor: pointer; position: relative; border-radius: 6px; }
        .day:hover { background: #f0f0f0; }
        .day.today { background: #667eea; color: #fff; }
        .day.today .day-num { color: #fff; }
        .day.selected { background: #52c41a; color: #fff; }
        .day.selected .day-num { color: #fff; }
        .day.empty { cursor: default; }
        .day-num { font-size: 14px; font-weight: bold; margin-bottom: 2px; }
        .day-tasks { width: 100%; display: flex; flex-direction: column; gap: 1px; align-items: center; overflow: hidden; }
        .day-task { width: 100%; font-size: 10px; padding: 1px 2px; border-radius: 3px; text-align: center; color: #fff; overflow: hidden; white-space: nowrap; }
        .day-task span { display: inline-block; padding-left: 100%; animation: marquee 4s linear infinite; }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
        .day-task.office { border-left: 2px solid #000; }
        .day-task.mall { border-left: 2px solid #1F497D; }
        .day-task.exec { opacity: 0.6; }

        .day-plans { background: #fff; border-radius: 10px; padding: 12px; margin-bottom: 10px; }
        .day-plans-title { font-size: 15px; font-weight: bold; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid #eee; }
        .plan-item { display: flex; align-items: center; justify-content: space-between; padding: 10px; background: #f9f9f9; border-radius: 8px; margin-bottom: 8px; }
        .plan-item.checked { background: #f6ffed; border: 1px solid #b7eb8f; }
        .plan-info { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 16px; flex: 1; min-width: 0; }
        .plan-regions { display: flex; gap: 4px; margin-top: 2px; }
        .region-tag { padding: 1px 6px; border-radius: 3px; font-size: 11px; color: #fff; }
        .region-tag.office { background: #000; }
        .region-tag.mall { background: #1F497D; }
        .region-tag.exec { background: #00B050; }
        .plan-del { background: #ff4d4f; color: #fff; border: none; border-radius: 50%; width: 26px; height: 26px; font-size: 16px; cursor: pointer; flex-shrink: 0; }
        .btn-complete { background: #52c41a; color: #fff; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-size: 13px; white-space: nowrap; flex-shrink: 0; margin-left: 8px; }
        .btn-complete:hover { background: #3a9d0c; }
        .no-plan { text-align: center; padding: 20px; color: #999; font-size: 14px; }

        .task-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; width: 100%; }
        .task-item { display: flex; flex-direction: column; padding: 10px; background: #fff; border-radius: 8px; gap: 6px; overflow: hidden; }
        .task-info { display: flex; align-items: center; gap: 8px; min-width: 0; }
        .task-icon { font-size: 20px; flex-shrink: 0; }
        .task-name { font-size: 12px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .task-count { font-size: 11px; color: #888; }
        .btn-assign { background: #667eea; color: #fff; border: none; padding: 6px 10px; border-radius: 5px; cursor: pointer; font-size: 12px; white-space: nowrap; }

        .no-task { text-align: center; padding: 20px; color: #999; }

        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal.show { display: flex; }
        .modal-body { background: #fff; border-radius: 12px; padding: 16px; width: 95%; max-height: 90vh; overflow-y: auto; }
        .modal-title { font-size: 18px; font-weight: bold; text-align: center; margin-bottom: 8px; }
        .modal-subtitle { text-align: center; color: #666; margin-bottom: 12px; font-size: 13px; }

        .assign-cal { background: #fff; border-radius: 10px; padding: 12px; margin-bottom: 12px; }
        .assign-info { text-align: center; margin-bottom: 12px; padding: 10px; background: #e6f7ff; border-radius: 10px; }
        .assign-info .icon { font-size: 28px; }
        .assign-info .name { font-size: 16px; font-weight: bold; margin-top: 6px; }
        .assign-cal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 8px; }
        .assign-cal-nav button { background: #667eea; color: #fff; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-size: 13px; }
        .assign-week { display: flex; background: #f0f0f0; border-radius: 6px; margin-bottom: 4px; }
        .assign-wd { flex: 1; text-align: center; padding: 6px; font-weight: bold; font-size: 12px; color: #667eea; cursor: pointer; border-radius: 6px; }
        .assign-wd:hover { background: #e8eaff; }
        .assign-wd:active { background: #667eea; color: #fff; }
        .assign-days { display: flex; flex-wrap: wrap; }
        .assign-day { width: 14.28%; min-height: 48px; display: flex; cursor: pointer; border-right: 1px solid #e0e0e0; border-bottom: 1px solid #e0e0e0; }
        .assign-day:nth-child(7n) { border-right: none; }
        .assign-day:hover { background: #f0f0f0; }
        .assign-day.empty { cursor: default; border-right: none; border-bottom: none; }
        .assign-day.empty:nth-child(7n) { border-right: none; }
        .assign-day-left { flex: 1; display: flex; align-items: center; justify-content: center; border-right: 1px solid #fff; border-radius: 6px 0 0 6px; font-size: 12px; }
        .assign-day-right { flex: 1; display: flex; align-items: center; justify-content: center; border-radius: 0 6px 6px 0; font-size: 12px; }
        .assign-day-left.selected { background: #000; color: #fff; }
        .assign-day-right.selected { background: #1F497D; color: #fff; }
        .assign-day-left.has-task { background: #666; color: #fff; }
        .assign-day-right.has-task { background: #1F497D; color: #fff; }
        .assign-day-left.in-date, .assign-day-right.in-date { background: #52c41a; color: #fff; }

        .region-selector { display: flex; gap: 8px; margin-bottom: 12px; }
        .region-btn { flex: 1; padding: 10px; border: 2px solid #ddd; border-radius: 8px; font-size: 14px; cursor: pointer; background: #fff; }
        .region-btn.active { border-color: #667eea; background: #e6f7ff; }
        .region-btn .region-name { font-weight: bold; }
        .region-btn .region-desc { font-size: 11px; color: #888; margin-top: 3px; }
        .region-btn.office.active { border-color: #000; background: #f5f5f5; }
        .region-btn.mall.active { border-color: #1F497D; background: #e6f0ff; }

        .selected-dates { margin-top: 12px; padding: 10px; background: #f9f9f9; border-radius: 10px; }
        .selected-dates-title { font-size: 13px; font-weight: bold; margin-bottom: 8px; color: #666; }
        .selected-date-tag { display: inline-block; padding: 4px 10px; background: #667eea; color: #fff; border-radius: 5px; margin: 3px; font-size: 12px; cursor: pointer; }
        .selected-date-tag.office { background: #000; }
        .selected-date-tag.mall { background: #1F497D; }

        .modal-btns { display: flex; gap: 10px; margin-top: 12px; }
        .btn-cancel { flex: 1; padding: 12px; background: #f0f0f0; color: #333; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
        .btn-confirm { flex: 1; padding: 12px; background: #52c41a; color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }

        .assign-page { padding: 12px; background: #f5f5f5; min-height: 100vh; }
        .assign-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
        .assign-title { font-size: 18px; margin: 0; }
    </style>
</head>
<body>
    <div class="container">
        <button class="back" id="btnBack">← 返回</button>
        <h1>⚡ 强电维保计划</h1>
        <div id="syncStatus" style="text-align:center;font-size:12px;color:#888;margin-bottom:8px;">
            <span id="syncInfo">📡 未连接服务器</span>
            <button class="cal-nav" id="btnSync" onclick="syncFromServer()" style="background:#1976D2;margin-left:8px;">🔄 同步</button>
        </div>
        
        <div class="view-tabs">
            <button class="tab active" id="tabCal" onclick="showView('calendar')">📅 日历视图</button>
            <button class="tab" id="tabList" onclick="showView('tasklist')">📋 任务列表</button>
        </div>
        
        <div id="viewCalendar">
            <div class="cal">
                <div class="cal-head">
                    <button class="cal-nav" id="btnPrev">◀</button>
                    <span class="cal-title" id="calTitle">2026年5月</span>
                    <button class="cal-nav" id="btnNext">▶</button>
                    <button class="cal-nav btn-export" id="btnExport">📥 导出Excel</button>
                </div>
                <div class="week">
                    <div class="wd">日</div><div class="wd">一</div><div class="wd">二</div>
                    <div class="wd">三</div><div class="wd">四</div><div class="wd">五</div><div class="wd">六</div>
                </div>
                <div class="days" id="calDays"></div>
            </div>
            
            <div class="day-plans">
                <div class="day-plans-title" id="dayPlansTitle">5月16日 计划</div>
                <div id="dayPlansList"></div>
            </div>
        </div>
        
        <div id="viewTaskList" style="display:none;">
            <div style="background:#fff;border-radius:10px;padding:10px;">
                <div class="task-list" id="taskList"></div>
            </div>
        </div>
    </div>

    <div id="viewAssign" style="display:none;">
        <div class="assign-page">
            <div class="assign-header">
                <button class="back" id="btnBackAssign">← 返回</button>
                <h1 class="assign-title">分配执行日期</h1>
            </div>
            <div class="assign-info" id="assignInfo"></div>
            <div class="assign-cal">
                <div class="assign-cal-head">
                    <button class="assign-cal-nav" onclick="assignChangeMonth(-1)">◀</button>
                    <span class="cal-title" id="assignCalTitle">2026年5月</span>
                    <button class="assign-cal-nav" onclick="assignChangeMonth(1)">▶</button>
                </div>
                <div style="text-align:center;margin-bottom:8px;color:#888;font-size:13px;">左半边 <b style="color:#000">●</b> 办公楼 &nbsp;|&nbsp; 右半边 <b style="color:#1F497D">●</b> 商场</div>
                <div style="text-align:center;margin-bottom:6px;color:#667eea;font-size:13px;">点击星期标签选中整列</div>
                <div class="assign-week">
                    <div class="assign-wd" onclick="toggleWeekday(0)">日</div>
                    <div class="assign-wd" onclick="toggleWeekday(1)">一</div>
                    <div class="assign-wd" onclick="toggleWeekday(2)">二</div>
                    <div class="assign-wd" onclick="toggleWeekday(3)">三</div>
                    <div class="assign-wd" onclick="toggleWeekday(4)">四</div>
                    <div class="assign-wd" onclick="toggleWeekday(5)">五</div>
                    <div class="assign-wd" onclick="toggleWeekday(6)">六</div>
                </div>
                <div class="assign-days" id="assignCalDays"></div>
            </div>
            <div class="selected-dates" id="selectedDates"></div>
            <div class="modal-btns">
                <button class="btn-cancel" onclick="closeAssignModal()">取消</button>
                <button class="btn-confirm" onclick="confirmAssign()">确认分配</button>
            </div>
        </div>
    </div>

    <script src="../../common/js/lib/jszip.min.js"></script>
    <script src="module.js"></script>
    <script src="../../common/js/api.js"></script>
    <script>
        const MODS = [
            { id: 'item-1',  name: '应急装置电池放电时间测试',   icon: '🔋', itemId: 1 },
            { id: 'item-2',  name: '擦窗机保养',                icon: '🪟', itemId: 2 },
            { id: 'item-3',  name: '应急发电机保养',            icon: '⚙️', itemId: 3 },
            { id: 'item-4',  name: '电容检查及测温',            icon: '🔌', itemId: 4 },
            { id: 'item-5',  name: '供电母排检查测温记录表',    icon: '⚡', itemId: 5 },
            { id: 'item-6',  name: '强电间月度巡检',            icon: '📋', itemId: 6 },
            { id: 'item-7',  name: '高压绝缘工具预防性试验',    icon: '🧪', itemId: 7 },
            { id: 'item-8',  name: '高压供电系统检查',          icon: '🔌', itemId: 8 },
            { id: 'item-9',  name: '泛光/景观照明系统检查',     icon: '💡', itemId: 9 },
            { id: 'item-10', name: '外围LOGO灯箱年检及备案',   icon: '📜', itemId: 10 },
            { id: 'item-11', name: '供配电设备电控箱月度检查',  icon: '⚙️', itemId: 11 },
            { id: 'item-12', name: '防雷检测',                  icon: '⛈️', itemId: 12 },
            { id: 'item-13', name: '电梯扶手梯故障报告',        icon: '🛗', itemId: 13 },
            { id: 'item-14', name: '电梯/扶手梯年检',          icon: '🛗', itemId: 14 },
            { id: 'item-15', name: '电扶梯维护保养',            icon: '🛗', itemId: 15 },
            { id: 'item-16', name: '电梯逃生门检查',            icon: '🚪', itemId: 16 }
        ];
        
        // moduleId到模块路径的映射
        var MODULE_MAP = {
            'item-1': 'battery-test',
            'item-3': 'generator',
            'item-4': 'capacitor-check',
            'item-5': 'busbar-check',
            'item-6': 'power-room-monthly',
            'item-13': 'elevator-handrail-fault',
            'item-16': 'elevator-escape'
        };
        
        const KEY = 'plan_strong_power';
        var taskColors = ['#667eea','#52c41a','#ff4d4f','#faad14','#13c2c2','#722ed1','#eb2f96','#fa8c16'];

        var calYear = new Date().getFullYear();
        var calMonth = new Date().getMonth();
        var selDate = formatDate(new Date());
        var currentView = 'calendar';
        var assignModuleId = null;
        var assignYear = new Date().getFullYear();
        var assignMonth = new Date().getMonth();
        var selectedDates = [];  // format: 'date_office' or 'date_mall'

        document.getElementById('btnBack').onclick = goBack;
        document.getElementById('btnBackAssign').onclick = closeAssignModal;
        document.getElementById('btnPrev').onclick = function() { changeMonth(-1); };
        document.getElementById('btnNext').onclick = function() { changeMonth(1); };
        document.getElementById('btnExport').onclick = function() {
            var ym = calYear + '-' + String(calMonth + 1).padStart(2, '0');
            StrongPowerPlanModule.exportExcel(ym);
        };

        function formatDate(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
        function getDays(y, m) { return new Date(y, m + 1, 0).getDate(); }
        function getFirst(y, m) { return new Date(y, m, 1).getDay(); }
        function getData() { var d = localStorage.getItem(KEY); return d ? JSON.parse(d) : {}; }
        function setData(d) { localStorage.setItem(KEY, JSON.stringify(d)); }
        
        function getModItemId(moduleId) {
            for (var i = 0; i < MODS.length; i++) {
                if (MODS[i].id === moduleId) return MODS[i].itemId;
            }
            return null;
        }
        
        function getTaskPlans(moduleId) {
            var data = getData();
            var result = [];
            for (var ds in data) {
                var plans = data[ds];
                for (var i = 0; i < plans.length; i++) {
                    if (plans[i].moduleId === moduleId) result.push({ date: ds, region: plans[i].region, checked: plans[i].checked });
                }
            }
            return result;
        }
        
        function getDatePlans(ds) { return getData()[ds] || []; }
        
        function assignDates(moduleId, region, dates) {
            var data = getData();
            var itemId = getModItemId(moduleId);
            // Remove existing for this module+region
            for (var ds in data) {
                data[ds] = data[ds].filter(function(p) { return !(p.moduleId === moduleId && p.region === region); });
                if (data[ds].length === 0) delete data[ds];
            }
            // Add new
            for (var i = 0; i < dates.length; i++) {
                var ds = dates[i];
                if (!data[ds]) data[ds] = [];
                data[ds].push({ moduleId: moduleId, region: region, checked: false });
            }
            setData(data);
        }

        function showView(v) {
            currentView = v;
            document.getElementById('tabCal').classList.toggle('active', v === 'calendar');
            document.getElementById('tabList').classList.toggle('active', v === 'tasklist');
            document.getElementById('viewCalendar').style.display = v === 'calendar' ? 'block' : 'none';
            document.getElementById('viewTaskList').style.display = v === 'tasklist' ? 'block' : 'none';
            document.getElementById('viewAssign').style.display = v === 'assign' ? 'block' : 'none';
            if (v === 'calendar') { renderCal(); renderDayPlans(); }
            else if (v === 'tasklist') { renderTaskList(); }
        }

        function changeMonth(n) {
            calMonth += n;
            if (calMonth > 11) { calMonth = 0; calYear++; }
            if (calMonth < 0) { calMonth = 11; calYear--; }
            renderCal();
            autoSyncCurrentMonth();
        }

        function renderCal() {
            document.getElementById('calTitle').textContent = calYear + '年' + (calMonth + 1) + '月';
            var grid = document.getElementById('calDays');
            var data = getData();
            var today = formatDate(new Date());
            var first = getFirst(calYear, calMonth);
            var total = getDays(calYear, calMonth);
            var html = '';
            for (var i = 0; i < first; i++) html += '<div class="day empty"></div>';
            for (var d = 1; d <= total; d++) {
                var ds = calYear + '-' + String(calMonth + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
                var cls = 'day';
                if (ds === today) cls += ' today';
                if (ds === selDate) cls += ' selected';
                var plans = data[ds] || [];
                var tasksHtml = '';
                for (var t = 0; t < plans.length; t++) {
                    var p = plans[t];
                    var m = null;
                    var mIdx = -1;
                    for (var j = 0; j < MODS.length; j++) { if (MODS[j].id === p.moduleId) { m = MODS[j]; mIdx = j; break; } }
                    if (!m) continue;
                    var color = taskColors[mIdx % taskColors.length];
                    var regionClass = p.region === 'mall' ? 'mall' : 'office';
                    var execClass = p.checked ? ' exec' : '';
                    tasksHtml += '<div class="day-task ' + regionClass + execClass + '" style="background:' + color + ';"><span>' + m.icon + ' ' + m.name + '</span></div>';
                }
                html += '<div class="' + cls + '" onclick="selectDate(\'' + ds + '\')">' +
                    '<div class="day-num">' + d + '</div>' +
                    '<div class="day-tasks">' + tasksHtml + '</div>' +
                    '</div>';
            }
            grid.innerHTML = html;
        }

        function selectDate(ds) { selDate = ds; renderCal(); renderDayPlans(); }

        function renderDayPlans() {
            var d = new Date(selDate);
            document.getElementById('dayPlansTitle').textContent = (d.getMonth() + 1) + '月' + d.getDate() + '日 周' + ['日','一','二','三','四','五','六'][d.getDay()] + ' 计划';
            var list = document.getElementById('dayPlansList');
            var plans = getDatePlans(selDate);
            if (plans.length === 0) { list.innerHTML = '<div class="no-plan">暂无计划</div>'; return; }
            
            // 按moduleId分组
            var grouped = {};
            for (var i = 0; i < plans.length; i++) {
                var p = plans[i];
                if (!grouped[p.moduleId]) {
                    grouped[p.moduleId] = { regions: [], checked: true, planIndex: i };
                }
                grouped[p.moduleId].regions.push(p.region);
                if (!p.checked) grouped[p.moduleId].checked = false;
            }
            
            var html = '';
            var idx = 0;
            for (var moduleId in grouped) {
                var g = grouped[moduleId];
                var m = null;
                var mIdx = -1;
                for (var j = 0; j < MODS.length; j++) { if (MODS[j].id === moduleId) { m = MODS[j]; mIdx = j; break; } }
                if (!m) m = { icon: '📋', name: moduleId };
                var color = mIdx >= 0 ? taskColors[mIdx % taskColors.length] : '#667eea';
                var targetModule = MODULE_MAP[moduleId];
                var completeBtn = targetModule 
                    ? '<button class="btn-complete" onclick="goToModule(\'' + targetModule + '\')">去完成</button>' 
                    : '';
                
                // 生成区域标签
                var regionTags = '';
                if (g.regions.indexOf('office') > -1) regionTags += '<span class="region-tag office">🏢 办公楼</span>';
                if (g.regions.indexOf('mall') > -1) regionTags += '<span class="region-tag mall">🏬 商场</span>';
                
                html += '<div class="plan-item' + (g.checked ? ' checked' : '') + '">' +
                    '<div class="plan-info" onclick="toggleModulePlans(\'' + selDate + '\', \'' + moduleId + '\')">' +
                    '<span>' + (g.checked ? '✅' : '⬜') + '</span>' +
                    '<div>' +
                    '<div style="font-size:18px;">' + m.icon + ' ' + m.name + '</div>' +
                    '<div class="plan-regions">' + regionTags + '</div>' +
                    '</div></div>' +
                    completeBtn + '</div>';
                idx++;
            }
            list.innerHTML = html;
        }
        
        // 切换某个moduleId下所有plan的选中状态
        function toggleModulePlans(date, moduleId) {
            var data = getData();
            if (data[date]) {
                for (var i = 0; i < data[date].length; i++) {
                    if (data[date][i].moduleId === moduleId) {
                        data[date][i].checked = !data[date][i].checked;
                    }
                }
                setData(data);
                renderCal();
                renderDayPlans();
            }
        }

        function renderTaskList() {
            var list = document.getElementById('taskList');
            var data = getData();
            var html = '';
            for (var i = 0; i < MODS.length; i++) {
                var m = MODS[i];
                var allPlans = getTaskPlans(m.id);
                var monthPlans = allPlans.filter(function(p) {
                    var d = new Date(p.date);
                    return d.getFullYear() === calYear && d.getMonth() === calMonth;
                });
                html += '<div class="task-item">' +
                    '<div class="task-info"><span class="task-icon">' + m.icon + '</span>' +
                    '<div><div class="task-name">' + m.name + '</div>' +
                    '<div class="task-count">当月已安排 ' + monthPlans.length + ' 个日期</div></div></div>' +
                    '<button class="btn-assign" onclick="openAssignModal(\'' + m.id + '\')">📅 分配日期</button></div>';
            }
            list.innerHTML = html;
        }

        function openAssignModal(moduleId) {
            assignModuleId = moduleId;
            assignYear = calYear;
            assignMonth = calMonth;
            // Load existing dates for this module in new format (date_region)
            var plans = getTaskPlans(moduleId);
            selectedDates = plans.map(function(p) { return p.date + '_' + p.region; });
            var m = null;
            for (var i = 0; i < MODS.length; i++) { if (MODS[i].id === moduleId) { m = MODS[i]; break; } }
            document.getElementById('assignInfo').innerHTML =
                '<div class="icon">' + (m ? m.icon : '📋') + '</div>' +
                '<div class="name">' + (m ? m.name : moduleId) + '</div>';
            renderAssignCal();
            initDragSelect();
            showView('assign');
        }

        function closeAssignModal() { showView('tasklist'); assignModuleId = null; selectedDates = []; }

        function assignChangeMonth(n) {
            assignMonth += n;
            if (assignMonth > 11) { assignMonth = 0; assignYear++; }
            if (assignMonth < 0) { assignMonth = 11; assignYear--; }
            renderAssignCal();
        }

        function renderAssignCal() {
            document.getElementById('assignCalTitle').textContent = assignYear + '年' + (assignMonth + 1) + '月';
            var grid = document.getElementById('assignCalDays');
            var first = getFirst(assignYear, assignMonth);
            var total = getDays(assignYear, assignMonth);
            var data = getData();
            var html = '';
            for (var i = 0; i < first; i++) html += '<div class="assign-day empty"></div>';
            for (var d = 1; d <= total; d++) {
                var ds = assignYear + '-' + String(assignMonth + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
                var dayPlans = data[ds] || [];
                var hasOffice = dayPlans.some(function(p) { return p.moduleId === assignModuleId && p.region === 'office'; });
                var hasMall = dayPlans.some(function(p) { return p.moduleId === assignModuleId && p.region === 'mall'; });
                var hasOfficeSelected = selectedDates.indexOf(ds + '_office') > -1;
                var hasMallSelected = selectedDates.indexOf(ds + '_mall') > -1;
                html += '<div class="assign-day">' +
                    '<div class="assign-day-left' + (hasOfficeSelected ? ' selected' : '') + (hasOffice && !hasOfficeSelected ? ' has-task' : '') + '" data-ds="' + ds + '" data-region="office">' + d + '</div>' +
                    '<div class="assign-day-right' + (hasMallSelected ? ' selected' : '') + (hasMall && !hasMallSelected ? ' has-task' : '') + '" data-ds="' + ds + '" data-region="mall">' + d + '</div>' +
                    '</div>';
            }
            grid.innerHTML = html;
            renderSelectedDates();
        }

        function toggleAssignDate(ds, region) {
            var key = ds + '_' + region;
            var idx = selectedDates.indexOf(key);
            if (idx > -1) selectedDates.splice(idx, 1); else selectedDates.push(key);
            selectedDates.sort();
            renderAssignCal();
        }

        function renderSelectedDates() {
            var el = document.getElementById('selectedDates');
            var officeCount = 0, mallCount = 0;
            for (var i = 0; i < selectedDates.length; i++) {
                if (selectedDates[i].endsWith('_office')) officeCount++;
                else mallCount++;
            }
            if (officeCount === 0 && mallCount === 0) {
                el.innerHTML = '<div class="selected-dates-title">点击日期格子的左(办公楼) / 右(商场) 半边分配</div>';
                return;
            }
            var html = '<div class="selected-dates-title">已选：<span style="background:#000;padding:2px 8px;color:#fff;border-radius:4px;margin-right:8px;">办公楼 ' + officeCount + '</span><span style="background:#1F497D;padding:2px 8px;color:#fff;border-radius:4px;">商场 ' + mallCount + '</span></div>';
            for (var i = 0; i < selectedDates.length; i++) {
                var parts = selectedDates[i].split('_');
                var ds = parts[0];
                var region = parts[1];
                var d = new Date(ds);
                html += '<span class="selected-date-tag ' + region + '" onclick="removeAssignDate(\'' + selectedDates[i] + '\')">' + (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + (region === 'office' ? '办公楼' : '商场') + ' ×</span>';
            }
            el.innerHTML = html;
        }

        function removeAssignDate(key) { var idx = selectedDates.indexOf(key); if (idx > -1) selectedDates.splice(idx, 1); renderAssignCal(); }

        // ---------- 任务分配弹窗日历 ----------
        function initDragSelect() {
            var grid = document.getElementById('assignCalDays');
            if (!grid) return;
            if (grid.dataset.dragInit) return;
            grid.dataset.dragInit = '1';

            grid.addEventListener('click', function(e) {
                var el = e.target.closest('.assign-day-left, .assign-day-right');
                if (!el || !el.dataset.ds || !el.dataset.region) return;
                toggleAssignDate(el.dataset.ds, el.dataset.region);
            });
        }

        // 点击星期标签 → 选中/取消当月所有该星期几的日期（办公楼和商场）
        function toggleWeekday(weekday) {
            var first = getFirst(assignYear, assignMonth);
            var total = getDays(assignYear, assignMonth);
            var keys = [];
            for (var d = 1; d <= total; d++) {
                var date = new Date(assignYear, assignMonth, d);
                if (date.getDay() === weekday) {
                    var ds = assignYear + '-' + String(assignMonth + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
                    keys.push(ds + '_office', ds + '_mall');
                }
            }
            // 检查是否全部已选中：是 → 取消；否 → 选中
            var allSelected = keys.every(function(k) { return selectedDates.indexOf(k) > -1; });
            if (allSelected) {
                keys.forEach(function(k) {
                    var idx = selectedDates.indexOf(k);
                    if (idx > -1) selectedDates.splice(idx, 1);
                });
            } else {
                keys.forEach(function(k) {
                    if (selectedDates.indexOf(k) === -1) selectedDates.push(k);
                });
            }
            selectedDates.sort();
            renderAssignCal();
        }
        // ---------- 任务分配弹窗日历结束 ----------

        function confirmAssign() {
            // selectedDates are in format 'date_region', split and assign
            var officeDates = [];
            var mallDates = [];
            for (var i = 0; i < selectedDates.length; i++) {
                var parts = selectedDates[i].split('_');
                if (parts[1] === 'office') officeDates.push(parts[0]);
                else mallDates.push(parts[0]);
            }
            assignDates(assignModuleId, 'office', officeDates);
            assignDates(assignModuleId, 'mall', mallDates);
            closeAssignModal();
            showView('tasklist');
        }

        function togglePlan(ds, idx) {
            var data = getData();
            if (data[ds] && data[ds][idx]) { data[ds][idx].checked = !data[ds][idx].checked; setData(data); renderCal(); renderDayPlans(); }
        }

        function deletePlan(ds, idx) {
            var data = getData();
            if (data[ds]) { data[ds].splice(idx, 1); if (data[ds].length === 0) delete data[ds]; setData(data); renderCal(); renderDayPlans(); }
        }

        function goBack() {
            if (parent.app && parent.app.backToCategory) parent.app.backToCategory();
            else window.location.href = '../../index.html';
        }
        
        function goToModule(modulePath) {
            // 跳转到对应的维保模块
            window.location.href = '../../modules/' + modulePath + '/index.html';
        }

        renderCal();
        renderDayPlans();
        
        // ========== 服务器同步 ==========
        var CATEGORY = 'strong-power';
        
        // 页面加载时检查服务器连接
        (function initServerSync() {
            checkServerConnection();
        })();
        
        // 检查服务器连接状态
        async function checkServerConnection() {
            var syncInfo = document.getElementById('syncInfo');
            var btnSync = document.getElementById('btnSync');
            try {
                var ok = await ApiClient.checkHealth();
                if (ok) {
                    syncInfo.textContent = '✅ 服务器已连接';
                    syncInfo.style.color = '#52c41a';
                    btnSync.style.background = '#52c41a';
                    
                    // 检查最后同步时间
                    var lastSync = API.getLastSyncTime();
                    if (lastSync) {
                        syncInfo.textContent = '✅ 服务器已连接 | 最后同步: ' + lastSync;
                    }
                    
                    // 自动同步当月数据
                    autoSyncCurrentMonth();
                } else {
                    syncInfo.textContent = '❌ 服务器连接失败';
                    syncInfo.style.color = '#ff4d4f';
                }
            } catch (e) {
                syncInfo.textContent = '❌ 服务器连接失败';
                syncInfo.style.color = '#ff4d4f';
            }
        }
        
        // 自动同步当月数据
        async function autoSyncCurrentMonth() {
            var yearMonth = calYear + '-' + String(calMonth + 1).padStart(2, '0');
            var syncInfo = document.getElementById('syncInfo');
            try {
                var serverPlan = await ApiClient.getPlan(CATEGORY, yearMonth);
                if (serverPlan) {
                    if (serverPlan.status === 'published') {
                        // 已下发才同步
                        mergeServerData(serverPlan.data);
                        syncInfo.textContent = '✅ 服务器已连接 | 计划:已下发';
                        syncInfo.style.color = '#52c41a';
                        // 刷新界面显示
                        renderCal();
                        renderDayPlans();
                    } else {
                        // 草稿不同步，只显示状态
                        syncInfo.textContent = '📝 服务器:草稿未下发';
                        syncInfo.style.color = '#faad14';
                    }
                } else {
                    syncInfo.textContent = '✅ 服务器已连接';
                    syncInfo.style.color = '#52c41a';
                }
            } catch (e) {
                console.log('自动同步失败:', e);
            }
        }
        
        // 从服务器同步数据
        async function syncFromServer() {
            var btnSync = document.getElementById('btnSync');
            var syncInfo = document.getElementById('syncInfo');
            
            btnSync.disabled = true;
            btnSync.textContent = '同步中...';
            syncInfo.textContent = '🔄 正在从服务器同步...';
            
            var yearMonth = calYear + '-' + String(calMonth + 1).padStart(2, '0');
            
            try {
                var serverPlan = await ApiClient.getPlan(CATEGORY, yearMonth);
                
                if (!serverPlan) {
                    syncInfo.textContent = '📭 服务器暂无数据';
                    syncInfo.style.color = '#faad14';
                    btnSync.textContent = '🔄 同步';
                    btnSync.disabled = false;
                    return;
                }
                
                if (serverPlan.status === 'published') {
                    // 已下发，合并数据
                    mergeServerData(serverPlan.data);
                    syncInfo.textContent = '✅ 同步成功！';
                    syncInfo.style.color = '#52c41a';
                } else {
                    syncInfo.textContent = '📝 服务器数据未下发';
                    syncInfo.style.color = '#faad14';
                }
                
                // 更新最后同步时间
                var now = new Date();
                var timeStr = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0') + ' ' + String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
                API.setLastSyncTime(timeStr);
                
                renderCal();
                renderDayPlans();
                
            } catch (e) {
                console.error('同步失败:', e);
                syncInfo.textContent = '❌ 同步失败';
                syncInfo.style.color = '#ff4d4f';
            }
            
            btnSync.textContent = '🔄 同步';
            btnSync.disabled = false;
        }
        
        // 合并服务器数据到本地
        function mergeServerData(serverData) {
            if (!serverData) return;
            
            var localData = getData();
            
            // 遍历服务器数据，合并到本地
            for (var dateKey in serverData) {
                if (!localData[dateKey]) {
                    // 本地没有，直接使用服务器数据
                    localData[dateKey] = serverData[dateKey];
                } else {
                    // 本地有，合并（服务器数据追加到本地）
                    var localPlans = localData[dateKey];
                    var serverPlans = serverData[dateKey];
                    
                    for (var i = 0; i < serverPlans.length; i++) {
                        var sp = serverPlans[i];
                        // 检查是否已存在
                        var exists = localPlans.some(function(p) {
                            return p.moduleId === sp.moduleId && p.region === sp.region;
                        });
                        if (!exists) {
                            localPlans.push(sp);
                        }
                    }
                }
            }
            
            setData(localData);
        }
    </script>
</body>
</html>
