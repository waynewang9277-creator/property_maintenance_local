<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>电梯逃生门检查</title>
    <link rel="stylesheet" href="../../common/css/style.css">
    <style>
        body { background: #f5f5f5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .module-header { display: flex; align-items: center; padding: 15px 20px; background: white; border-bottom: 1px solid #eee; gap: 15px; }
        .btn-back { padding: 8px 16px; background: #666; color: white; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; }
        .module-title { font-size: 16pt; font-weight: bold; color: #333; flex: 1; }
        .module-main { padding: 12px; }

        .check-items-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px; }
        .check-item-card { background: white; border-radius: 10px; padding: 15px; text-align: center; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .check-item-card.pass { border: 2px solid #52c41a; }
        .check-item-card.fail { border: 2px solid #ff4d4f; }
        .item-icon { font-size: 28px; margin-bottom: 5px; }
        .item-name { font-size: 12pt; font-weight: bold; color: #333; margin-bottom: 3px; }
        .item-status { font-size: 10pt; color: #666; }
        .item-photos { font-size: 9pt; color: #999; margin-top: 3px; }

        .result-section { background: white; border-radius: 10px; padding: 15px; margin-bottom: 15px; }
        .section-title { font-size: 14pt; font-weight: bold; color: #333; margin-bottom: 10px; }
        .result-buttons { display: flex; gap: 10px; }
        .result-buttons .btn { flex: 1; }

        .remark-section { background: white; border-radius: 10px; padding: 15px; margin-bottom: 15px; }
        .remark-input { width: 100%; min-height: 80px; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 12pt; resize: vertical; }

        .action-buttons { display: flex; gap: 10px; }
        .action-buttons .btn { flex: 1; }

        /* 弹窗样式 */
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; }
        .modal-content { background: white; margin: 20px auto; border-radius: 12px; padding: 20px; max-width: 90%; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .modal-title { font-size: 16pt; font-weight: bold; }
        .modal-close { background: none; border: none; font-size: 24px; cursor: pointer; }

        .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
        .photo-thumb { position: relative; aspect-ratio: 1; }
        .photo-thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; }
        .photo-thumb .btn-remove { position: absolute; top: -5px; right: -5px; background: #ff4d4f; color: white; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 14px; cursor: pointer; }
        .photo-add-btn { aspect-ratio: 1; border: 2px dashed #ddd; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 30px; color: #999; cursor: pointer; }

        #modal-result-buttons { display: flex; gap: 10px; margin-top: 10px; }
        #modal-result-buttons .btn { flex: 1; }

        /* 预览弹窗 */
        #preview-modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9); z-index: 2000; }
        #preview-image { max-width: 90%; max-height: 90%; margin: 5% auto; display: block; }
        .preview-close { position: absolute; top: 20px; right: 20px; background: white; border: none; border-radius: 50%; width: 40px; height: 40px; font-size: 20px; cursor: pointer; }

        /* Loading */
        #loading-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 3000; justify-content: center; align-items: center; }
        #loading-text { color: white; font-size: 18px; }
    </style>
</head>
<body>
    <div class="container">
        <header class="module-header">
            <button class="btn-back" onclick="parent.postMessage('goBackToCategory', '*')">← 返回分类</button>
            <h2 class="module-title">🚪 电梯逃生门检查</h2>
        </header>

        <main class="module-main">
            <div id="items-container"></div>
        </main>
    </div>

    <!-- 检查项弹窗 -->
    <div id="item-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span id="modal-title" class="modal-title">检查项</span>
                <button class="modal-close" onclick="document.getElementById('item-modal').style.display='none'">×</button>
            </div>
            <div id="modal-photos" class="photo-grid"></div>
            <div id="modal-result-buttons"></div>
        </div>
    </div>

    <!-- 预览弹窗 -->
    <div id="preview-modal">
        <button class="preview-close" onclick="document.getElementById('preview-modal').style.display='none'">×</button>
        <img id="preview-image" src="" alt="预览">
    </div>

    <!-- Loading -->
    <div id="loading-overlay">
        <div id="loading-text">正在处理...</div>
    </div>

    <script src="../../common/js/lib/jszip.min.js"></script>
    <script src="../../common/js/api.js"></script>
    <script src="module.js"></script>
</body>
</html>
