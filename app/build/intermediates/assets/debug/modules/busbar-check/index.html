<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>供电母排检查测温</title>
    <link rel="stylesheet" href="../../common/css/style.css">
    <script src="../../common/js/lib/jszip.min.js"></script>
    <script src="../../common/js/tesseract.min.js"></script>
    <script src="../../common/js/lib/xlsx.full.min.js"></script>
    <style>
        body { padding: 20px; font-family: 'Microsoft YaHei', sans-serif; background: #f5f5f5; }

        .module-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .module-title { font-size: 18pt; font-weight: bold; color: #333; }

        .info-bar { background: #fff3e0; padding: 10px 15px; border-radius: 8px; margin-bottom: 15px; font-size: 11pt; color: #e65100; }

        .btn { padding: 10px 20px; border: none; border-radius: 6px; font-size: 12pt; cursor: pointer; }
        .btn-primary { background: #1565C0; color: white; }
        .btn-secondary { background: #9e9e9e; color: white; }
        .btn-danger { background: #d32f2f; color: white; }
        .btn-sm { padding: 6px 12px; font-size: 11pt; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .test-form-card {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .form-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        .form-header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .form-title { font-size: 14px; font-weight: bold; color: #333; }
        .btn-collapse {
            background: #e0e0e0; color: #333; border: none;
            border-radius: 4px; width: 28px; height: 28px;
            font-size: 12px; cursor: pointer; line-height: 28px; text-align: center;
        }
        .btn-collapse:active { background: #bdbdbd; }
        .btn-remove {
            background: #ff4d4f; color: white; border: none;
            border-radius: 50%; width: 24px; height: 24px;
            font-size: 16px; cursor: pointer; line-height: 24px; text-align: center;
        }
        .btn-remove:active { background: #ff7875; }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 11pt; color: #666; margin-bottom: 4px; }
        .form-row { display: flex; gap: 10px; }
        .form-row .form-group { flex: 1; }

        /* 设备列表 */
        .device-list { margin-top: 10px; }
        .test-form-card.collapsed .device-list { display: none; }
        .test-form-card.collapsed .form-header { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .device-item {
            display: flex; align-items: flex-start; gap: 8px;
            padding: 8px 10px; background: #f5f5f5; border-radius: 6px;
            margin-bottom: 6px; flex-wrap: wrap;
        }
        .device-item.completed { background: #e8f5e9; }
        .device-name { flex: 1; font-size: 11pt; font-weight: bold; color: #333; min-width: 0; }
        .device-location { font-size: 10pt; color: #666; min-width: 80px; }
        .device-temps { display: flex; gap: 6px; font-size: 10pt; flex-wrap: wrap; width: 100%; margin-top: 4px; }
        .temp-tag { padding: 2px 6px; background: #e3f2fd; border-radius: 4px; color: #1565C0; white-space: nowrap; }
        .temp-tag.high { background: #ffebee; color: #d32f2f; }
        .btn-photo {
            padding: 6px 12px; background: #1565C0; color: white;
            border: none; border-radius: 4px; font-size: 11pt; cursor: pointer;
        }
        .btn-photo:active { background: #0d47a1; }
        .btn-photo.has-photo { background: #4caf50; }
        .btn-photo.has-photo:active { background: #388e3c; }

        /* 顶部操作栏 */
        .top-bar { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; align-items: center; }
        .top-bar label { display: flex; align-items: center; gap: 5px; font-size: 11pt; }
        .top-bar input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 11pt; }
        #room-temp { width: 70px; }

        /* 历史记录列表 */
        .record-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 15px; background: #f9f9f9; border-radius: 8px;
            margin-bottom: 10px; cursor: pointer;
        }
        .record-item:active { background: #f0f0f0; }
        .record-info { flex: 1; display: flex; flex-direction: column; gap: 4px; }
        .record-location { font-size: 14px; color: #333; font-weight: 500; }
        .record-date { font-size: 12px; color: #666; }
        .record-count { font-size: 11px; color: #999; }
        .btn-delete {
            background: #ff4d4f; color: white; border: none;
            border-radius: 4px; padding: 6px 12px; font-size: 12pt; cursor: pointer;
            margin-left: 10px;
        }
        .btn-delete:active { background: #ff7875; }

        /* 底部操作区 */
        .bottom-actions { display: flex; gap: 10px; margin-top: 15px; }
        .bottom-actions button { flex: 1; }

        /* 空状态提示 */
        .empty-tip { text-align: center; padding: 40px 20px; color: #999; font-size: 13pt; }

        /* 加载遮罩 */
        #loading-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 9999; align-items: center; justify-content: center; }
        #loading-overlay > div { background: white; padding: 20px 40px; border-radius: 8px; text-align: center; }
        #loading-overlay .msg { font-size: 14pt; color: #333; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <header class="module-header">
            <button class="btn-back" onclick="parent.goBackWithContext()">← 返回分类</button>
            <h2 class="module-title">⚡ 供电母排检查测温</h2>
        </header>

        <div id="loading-overlay">
            <div>
                <div style="font-size:14pt;color:#333;">正在处理...</div>
                <div class="msg" id="loading-msg">请稍候</div>
            </div>
        </div>

        <div class="info-bar">
            💡 选择分组 → 为每个设备拍照 → OCR自动识别温度 → 导出Excel
        </div>

        <!-- 顶部操作栏 -->
        <div class="top-bar">
            <label><span>检查日期:</span><input type="date" id="check-date"></label>
            <label><span>室温:</span><input type="text" id="room-temp" placeholder="如: 26℃"></label>
            <button class="btn btn-secondary btn-sm" onclick="BusbarModule.clearAll()">🗑 清空数据</button>
            <button class="btn btn-primary btn-sm" onclick="BusbarModule.exportExcel()">📊 导出Excel</button>
        </div>

        <!-- 历史记录（已保存的分组） -->
        <div id="records-container"></div>

        <!-- 分组选择/表单容器 -->
        <div id="group-forms-container"></div>

        <!-- 底部新建按钮 -->
        <div id="bottom-actions" class="bottom-actions">
            <button class="btn btn-primary" id="btn-new-group">➕ 新建分组测试</button>
        </div>
    </div>

    <script src="module.js"></script>
    <script src="../../common/js/api.js"></script>
</body>
</html>
